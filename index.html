<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111819">
	<meta name="description" content="Build your boss. Enter the arena. Ascend through 540 upgrade ranks in BOSSFORGE: ASCENSION.">
	<title>BOSSFORGE: ASCENSION</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #090a0e;
			--panel: #1a1b23;
			--panel-raised: #24252e;
			--line: rgba(215, 236, 222, .12);
			--muted: #91a29b;
			--text: #e9f0e9;
			--accent: #e63946;
			--danger: #ff777c;
			--display: "Bahnschrift", "Franklin Gothic Medium", "Arial Narrow", sans-serif;
			--mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			background: var(--bg);
			color: var(--text);
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(ellipse at 76% 15%, rgba(153, 35, 48, .14), transparent 35%), linear-gradient(150deg, #111117, #090a0e 64%); }
		button, input { font: inherit; }
		button { color: inherit; }
		button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
		.app { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); transition: grid-template-columns .24s ease; }
		.sidebar { display: flex; flex-direction: column; gap: 30px; padding: 24px 15px 18px; background: rgba(14, 20, 20, .84); border-right: 1px solid var(--line); min-height: 100vh; position: relative; z-index: 3; }
		.brand { padding: 2px 10px 20px; border-bottom: 1px solid var(--line); }
		.brand-mark { width: 39px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--accent); color: var(--accent); font: 800 21px var(--display); transform: rotate(45deg); margin: 2px 0 18px 5px; }
		.brand-mark span { transform: rotate(-45deg); }
		.brand h1 { font: 800 20px/1 var(--display); letter-spacing: 0; margin: 0; }
		.brand h1 span { color: var(--accent); }
		.brand p { color: var(--muted); font: 10px var(--mono); margin: 8px 0 0; }
		.nav-label, .eyebrow { font: 10px var(--mono); letter-spacing: 0; color: #8c9e96; }
		.nav-label { padding: 0 10px; margin: 0 0 8px; }
		.nav-list { display: grid; gap: 4px; }
		.nav-button { position: relative; border: 0; background: transparent; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 11px 10px; color: #adbbb4; cursor: pointer; transition: background .16s, color .16s; font-size: 13px; }
		.nav-button:hover { background: rgba(230, 247, 234, .06); color: white; }
		.nav-button.active { color: var(--text); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent); }
		.nav-button.active::before { position: absolute; content: ""; width: 2px; inset: 7px auto 7px 0; background: var(--accent); }
		.nav-code { width: 21px; color: var(--accent); font: 10px var(--mono); }
		.sidebar-bottom { margin-top: auto; display: grid; gap: 12px; padding: 0 9px; }
		.pilot-chip { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 15px; }
		.pilot-avatar { width: 32px; aspect-ratio: 1; display: grid; place-items: center; color: var(--accent); background: #243130; border: 1px solid #465a51; font: 12px var(--mono); }
		.pilot-info { min-width: 0; display: grid; gap: 4px; font-size: 12px; }
		.pilot-info small { color: var(--muted); font: 9px var(--mono); }
		.content { min-width: 0; }
		.topbar { min-height: 67px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 34px; border-bottom: 1px solid var(--line); background: rgba(18, 25, 25, .66); }
		.topbar-left, .resources { display: flex; align-items: center; gap: 15px; }
		.icon-button { border: 1px solid var(--line); color: #b9c7c0; background: transparent; width: 35px; height: 35px; cursor: pointer; transition: .18s ease; }
		.icon-button:hover { border-color: var(--accent); color: var(--accent); }
		.breadcrumb { color: #98a69f; font: 10px var(--mono); }
		.breadcrumb strong { color: var(--text); font-weight: 400; }
		.resource { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: #e5eadd; }
		.resource-mark { color: var(--accent); font-size: 14px; }
		.resource-separator { height: 22px; width: 1px; background: var(--line); }
		#view { min-height: calc(100vh - 68px); padding: 30px 34px 44px; max-width: 1680px; margin: 0 auto; }
		.play-layout { display: grid; grid-template-columns: minmax(0, 1fr) 238px; gap: 28px; animation: reveal .32s ease both; }
		.arena-column { min-width: 0; }
		.arena-heading { display: flex; justify-content: space-between; align-items: end; margin: 0 0 18px; }
		.arena-heading h1, .page-heading h1 { font: 800 34px/.98 var(--display); letter-spacing: 0; margin: 8px 0 0; }
		.stage-tag, .count-badge { border: 1px solid var(--line); color: var(--accent); padding: 8px 10px; font: 10px var(--mono); white-space: nowrap; }
		.canvas-wrap { position: relative; height: clamp(310px, 52vh, 540px); border: 1px solid rgba(205, 236, 218, .22); background: #101719; overflow: hidden; }
		.canvas-wrap::before, .canvas-wrap::after { content: ""; position: absolute; pointer-events: none; z-index: 1; }
		.canvas-wrap::before { inset: 0; background: linear-gradient(90deg, rgba(16, 23, 25, .48), transparent 32%, transparent 72%, rgba(16, 23, 25, .2)); }
		.canvas-wrap::after { inset: 10px; border: 1px solid rgba(220, 241, 225, .08); }
		#arena { width: 100%; height: 100%; display: block; }
		.arena-hud { position: absolute; z-index: 2; top: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 10px; color: #d4e4d8; font: 10px var(--mono); text-shadow: 0 1px 8px #0d1414; pointer-events: none; }
		.arena-hud span { background: rgba(15, 22, 22, .66); padding: 7px 8px; }
		.arena-hud.result { justify-content: center; top: 50%; transform: translateY(-50%); font: 700 16px var(--display); }
		.arena-hud.result span { background: rgba(15, 22, 22, .88); padding: 12px; }
		.mobile-controls { display: none; }
		.run-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; }
		.mode-select { display: flex; flex-wrap: wrap; gap: 5px; }
		.mode-button { border: 1px solid transparent; padding: 9px 10px; background: transparent; color: #aab8b1; font-size: 11px; cursor: pointer; transition: .16s; }
		.mode-button:hover, .mode-button.selected { border-color: var(--line); color: var(--text); background: #1a2423; }
		.mode-button.selected { border-bottom-color: var(--accent); }
		.primary-button, .secondary-button { min-height: 42px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 14px; border: 1px solid var(--accent); background: var(--accent); color: #10201d; font: 700 11px var(--mono); cursor: pointer; transition: transform .16s, filter .16s, opacity .16s; white-space: nowrap; }
		.primary-button:hover:not(:disabled), .secondary-button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
		.secondary-button { background: transparent; color: var(--accent); }
		button:disabled { opacity: .38; cursor: not-allowed; }
		.control-hint { color: #7f9087; font: 10px var(--mono); margin: 13px 0 0; }
		.play-rail { padding: 10px 0; border-left: 1px solid var(--line); padding-left: 22px; }
		.rail-title { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 18px; }
		.live-dot { width: 6px; aspect-ratio: 1; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
		.rail-stat { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 13px 0; color: #a8b6ad; font-size: 12px; }
		.rail-stat strong { color: var(--text); font: 16px var(--mono); }
		.rail-stat small { color: var(--muted); font-size: 9px; }
		.rail-contract { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 18px; }
		.mini-contract { margin-top: 13px; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #c7d3cc; }
		.mini-contract b { color: var(--accent); font: 10px var(--mono); }
		.text-button { display: flex; justify-content: space-between; width: 100%; padding: 11px 0 0; border: 0; background: transparent; color: var(--accent); cursor: pointer; text-align: left; font-size: 11px; }
		.chest-mini p { font-size: 12px; color: #bdc9c1; }
		.page-view { animation: reveal .28s ease both; }
		.page-heading { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 28px; }
		.page-heading p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
		.network-progress { display: flex; align-items: center; gap: 12px; width: min(250px, 28vw); color: var(--accent); font: 11px var(--mono); }
		.progress-line, .contract-progress > div { flex: 1; height: 4px; background: #2a3633; }
		.progress-line i, .contract-progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
		.network-grid { border-top: 1px solid var(--line); }
		.discipline-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); border-bottom: 1px solid var(--line); min-width: 780px; }
		.network-grid { overflow-x: auto; }
		.discipline-name { display: flex; align-items: center; gap: 10px; padding: 10px 8px; color: #cad6ce; font-size: 12px; }
		.discipline-name span { color: var(--accent); font: 10px var(--mono); }
		.sector-list { display: grid; grid-template-columns: repeat(10, minmax(58px, 1fr)); gap: 4px; padding: 5px 0; }
		.node { min-width: 0; min-height: 54px; display: grid; place-items: center; gap: 3px; border: 1px solid transparent; background: #192221; cursor: pointer; transition: .16s ease; }
		.node:hover { border-color: var(--accent); background: #23302d; }
		.node-name { overflow: hidden; max-width: 100%; color: #b5c3ba; text-overflow: ellipsis; font-size: 9px; }
		.node small { color: #77877e; font: 8px var(--mono); }
		.node-pips { display: flex; gap: 3px; }
		.node-pips i { width: 8px; height: 3px; background: #3a4641; }
		.node-pips i.filled { background: var(--accent); }
		.prestige-strip { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 24px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
		.prestige-strip p { color: #c6d0c9; margin: 7px 0 0; font-size: 12px; }
		.prestige-condition { color: #f6ab8b; font: 10px var(--mono); white-space: nowrap; }
		.contract-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
		.contract-card { padding: 22px; background: #17201f; min-height: 180px; }
		.contract-index { color: var(--accent); font: 9px var(--mono); }
		.contract-card h2 { margin: 17px 0 7px; font: 700 18px var(--display); }
		.contract-card p { margin: 0; color: var(--muted); font-size: 12px; }
		.contract-progress { margin: 19px 0; display: flex; align-items: center; gap: 12px; color: #c4d1c8; font: 10px var(--mono); }
		.contract-reward { padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font: 9px var(--mono); color: #8c9d94; }
		.contract-reward b { color: #e3ece3; font-weight: 400; }
		.contract-reward i { color: var(--accent); font-style: normal; margin-left: 7px; }
		.locker-group { margin: 25px 0 35px; }
		.locker-title { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); }
		.locker-title h2 { font: 700 19px var(--display); }
		.locker-title span { color: var(--muted); font: 9px var(--mono); }
		.cosmetic-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; padding-top: 10px; }
		.cosmetic { min-width: 0; min-height: 76px; padding: 10px; display: grid; grid-template-columns: 23px minmax(0, 1fr); grid-template-rows: 1fr auto; gap: 5px 9px; align-items: center; background: #192221; border: 1px solid var(--line); text-align: left; cursor: pointer; }
		.cosmetic:hover:not(:disabled), .cosmetic.equipped { border-color: var(--accent); }
		.cosmetic.locked { opacity: .46; cursor: not-allowed; }
		.cosmetic > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
		.cosmetic small { grid-column: 2; color: var(--accent); font: 8px var(--mono); }
		.swatch { grid-row: span 2; width: 21px; height: 35px; border: 1px solid rgba(255,255,255,.25); background: var(--swatch); clip-path: polygon(50% 0, 100% 22%, 82% 100%, 18% 100%, 0 22%); }
		.vault-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
		.vault-slot { min-height: 300px; display: flex; flex-direction: column; align-items: flex-start; padding: 21px; border: 1px solid var(--line); background: linear-gradient(160deg, #202b29, #151e1e 70%); }
		.vault-slot.ready { border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
		.chest-art { width: 100%; flex: 1; min-height: 105px; display: grid; place-items: center; color: var(--accent); font-size: 54px; text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 60%, transparent); }
		.vault-slot strong { font: 12px var(--mono); }
		.vault-slot p { min-height: 30px; color: var(--muted); font-size: 12px; }
		.vault-slot button { width: 100%; }
		.leaderboard { border-top: 1px solid var(--line); }
		.leader-head, .leader-entry { display: grid; grid-template-columns: 70px minmax(100px, 1.5fr) minmax(90px, 1fr) minmax(75px, .6fr); align-items: center; gap: 10px; min-height: 45px; border-bottom: 1px solid var(--line); }
		.leader-head { color: #83948b; font: 9px var(--mono); }
		.leader-entry { color: #b6c4bb; font-size: 12px; }
		.leader-entry > span:first-child, .leader-entry b { color: var(--accent); font-family: var(--mono); }
		.leader-entry b { text-align: right; font-weight: 400; }
		.leader-entry > :last-child { justify-self: end; }
		.leader-entry strong { overflow: hidden; text-overflow: ellipsis; }
		.empty-records { padding: 28px 0; color: var(--muted); font-size: 13px; }
		.record-form { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; padding: 16px; background: #192221; }
		.record-form label { margin-right: auto; font-size: 12px; }
		.record-form input { min-width: 170px; height: 42px; padding: 0 11px; color: var(--text); border: 1px solid var(--line); background: #111819; }
		.download-button { margin-top: 28px; }
		.editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
		.editor-main, .editor-inspector { min-width: 0; }
		.editor-toolbar, .editor-actions, .editor-tabs, .editor-palette { display: flex; flex-wrap: wrap; gap: 6px; }
		.editor-toolbar { margin-bottom: 12px; }
		.editor-tool, .editor-action, .editor-tab { min-height: 34px; padding: 0 10px; border: 1px solid var(--line); background: #191a22; color: #c8c9d0; font-size: 11px; cursor: pointer; }
		.editor-tool:hover, .editor-action:hover, .editor-tab:hover, .editor-tool.selected, .editor-tab.selected { border-color: var(--accent); color: #fff; }
		.editor-stage { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 16px; align-items: start; }
		.pixel-canvas { display: block; width: 100%; max-width: 620px; aspect-ratio: 1; background-color: #101117; background-image: linear-gradient(45deg, #191a22 25%, transparent 25%), linear-gradient(-45deg, #191a22 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #191a22 75%), linear-gradient(-45deg, transparent 75%, #191a22 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; border: 1px solid #454650; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
		.editor-preview { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); image-rendering: pixelated; background: #111219; }
		.editor-inspector { display: grid; gap: 13px; padding: 16px; background: #15161d; border: 1px solid var(--line); }
		.editor-inspector label, .editor-field label { display: grid; gap: 6px; color: #aeb0ba; font: 10px var(--mono); }
		.editor-inspector input, .editor-inspector select { min-width: 0; width: 100%; min-height: 35px; padding: 0 8px; color: var(--text); border: 1px solid var(--line); background: #0d0e13; }

		.editor-inspector input[type="color"] { height: 38px; padding: 3px; }
		.editor-field { display: grid; gap: 5px; }
		.editor-palette button { width: 23px; height: 23px; border: 1px solid #fff4; background: var(--swatch); cursor: pointer; }
		.editor-check { display: flex !important; grid-template-columns: 16px 1fr; align-items: center; }

		.boss-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

		.boss-chip.selected { border-color: var(--accent); color: white; }
		.editor-meta { color: var(--muted); font: 9px var(--mono); }
		.editor-check-row { display: flex; align-items: center; gap: 7px; color: #b3b5be; font-size: 11px; }
		.editor-check-row input { accent-color: var(--accent); }
		#toast { position: fixed; z-index: 10; right: 22px; bottom: 22px; max-width: min(400px, calc(100vw - 36px)); padding: 13px 17px; border: 1px solid var(--accent); background: #172220; color: var(--text); font-size: 12px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
		#toast.visible { opacity: 1; transform: translateY(0); }
		.nav-collapsed .app { grid-template-columns: 72px minmax(0, 1fr); }
		.nav-collapsed .sidebar { padding-right: 10px; padding-left: 10px; }

		.nav-collapsed .brand-mark { margin-left: 5px; }

			.mobile-controls button { border: 1px solid rgba(227, 245, 231, .23); background: rgba(20, 29, 28, .75); color: var(--text); font: 14px var(--mono); touch-action: none; }
